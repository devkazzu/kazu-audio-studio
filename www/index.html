
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0714" />
  <title>KAZU Audio Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0B0714;
      color: white;
      font-family: Arial, sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    .loader { text-align: center; }
    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #B78AFF;
    }
    p { color: #aaa0bd; font-size: 13px; }
  </style>
</head>
<body>
  <main class="loader">
    <div class="logo">KAZU</div>
    <p>Loading Audio Studio...</p>
  </main>
</body>
</html>
